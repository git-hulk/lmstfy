name: release docker image

on:
  push:
    tags:
      - v*

jobs:
  release-docker-image:
    name: Release Docker Image
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.17.x]

    runs-on: ubuntu-18.04
    steps:

      - name: Install Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{matrix.go-version}}

      - name: Checkout Code Base
        uses: actions/checkout@v3
        with:
          fetch-depth: 64

      - name: Set ENV
        run: |
          echo "RELEASE_TAG=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV

      - name: Login Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker arm64 Image
        run: |
          export TARGET_ARCH=arm64
          export IMAGE_NAME="bitleak/lmstfy"
          export IMAGE_TAG="$RELEASE_TAG-$TARGET_ARCH"
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Build Docker amd64 Image
        run: |
          export TARGET_ARCH=amd64
          export IMAGE_NAME="bitleak/lmstfy"
          export IMAGE_TAG="$RELEASE_TAG-$TARGET_ARCH"
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Merge Docker Image
        run: |
          export IMAGE_NAME="bitleak/lmstfy"
          export IMAGE_TAG="$RELEASE_TAG"
          docker manifest create $IMAGE_NAME:$IMAGE_TAG --amend $IMAGE_NAME:$IMAGE_TAG-amd64 --amend $IMAGE_NAME:$IMAGE_TAG-arm64
          docker manifest inspect $IMAGE_NAME:$IMAGE_TAG
          docker manifest push $IMAGE_NAME:$IMAGE_TAG
          docker manifest create $IMAGE_NAME:latest --amend $IMAGE_NAME:$IMAGE_TAG-amd64 --amend $IMAGE_NAME:$IMAGE_TAG-arm64
          docker manifest inspect $IMAGE_NAME:latest
          docker manifest push $IMAGE_NAME:latest
